<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romania's Rivers</title>
  <meta name="description" content="Romania's river network drawn from OpenStreetMap, with water flowing down to the Black Sea. Zoom and pan for detail." />
  <!-- Rounded, friendly lettering for the panel; the page falls back to the system font offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="nsc-river-map is-loading">
    <!-- Shown while the page loads: water flowing in a drop. Fades out once
         the map is ready (main.js removes is-loading). -->
    <div class="map-loader" role="status" aria-label="Loading the map">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><clipPath id="loader-drop"><circle cx="32" cy="32" r="26" /></clipPath></defs>
        <g clip-path="url(#loader-drop)">
          <path class="wave back" d="M0 0q8-5 16 0t16 0 16 0 16 0 16 0 16 0 16 0 16 0V40H0Z" />
          <path class="wave front" d="M0 0q8-5 16 0t16 0 16 0 16 0 16 0 16 0 16 0 16 0V40H0Z" />
        </g>
        <circle class="ring" cx="32" cy="32" r="29" />
      </svg>
    </div>

    <canvas class="map-canvas" tabindex="0" aria-label="Map of Romania's rivers and the cities on them, with pulses of water flowing down to the sea. Scroll or pinch to zoom, drag or use the arrow keys to move, 0 to reset."></canvas>

    <section class="map-panel">
      <h1 class="map-title">Romania's Rivers</h1>

      <ul class="layer-list" aria-label="Layers">
        <li class="layer-item" data-layer-row="rivers" style="--tint: #3a86ff">
          <span class="layer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2 9c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" /><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" /></svg>
          </span>
          <span class="layer-name">Rivers</span>
          <button type="button" class="layer-toggle" data-layer="rivers" aria-pressed="true" aria-label="Show rivers"><span class="knob"></span></button>
        </li>
        <li class="layer-item is-hidden" data-layer-row="cities" style="--tint: #ffbe0b">
          <span class="layer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 21h18" /><path d="M5 21V9l5-4 5 4v12" /><path d="M15 21v-8h4v8" /><path d="M9 21v-4h2v4" /></svg>
          </span>
          <span class="layer-name">Cities</span>
          <button type="button" class="layer-toggle" data-layer="cities" aria-pressed="false" aria-label="Show cities"><span class="knob"></span></button>
        </li>
        <li class="layer-item is-hidden" data-layer-row="roads" style="--tint: #2ec4b6">
          <span class="layer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 3 5 21" /><path d="m16 3 3 18" /><path d="M12 4v3" /><path d="M12 10.5v3" /><path d="M12 17v3" /></svg>
          </span>
          <span class="layer-name">Roads</span>
          <button type="button" class="layer-toggle" data-layer="roads" aria-pressed="false" aria-label="Show roads"><span class="knob"></span></button>
        </li>
        <li class="layer-item is-hidden" data-layer-row="basins" style="--tint: #8338ec">
          <span class="layer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4h-4a2 2 0 1 0-4 0H4v-4a2 2 0 1 0 0-4Z" /></svg>
          </span>
          <span class="layer-name">River basins</span>
          <button type="button" class="layer-toggle" data-layer="basins" aria-pressed="false" aria-label="Show river basins"><span class="knob"></span></button>
        </li>
        <li class="layer-item" data-layer-row="border" style="--tint: #ff5d8f">
          <span class="layer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 18c3-2 2-6 5-8s6 1 8-2 1-4 3-4" stroke-dasharray="3 3" /></svg>
          </span>
          <span class="layer-name">Border</span>
          <button type="button" class="layer-toggle" data-layer="border" aria-pressed="true" aria-label="Show the border"><span class="knob"></span></button>
        </li>
        <li class="layer-item" data-layer-row="terrain" style="--tint: #38b000">
          <span class="layer-icon" aria-hidden="true">
            <!-- Romania's outline, the same path as the favicon (from the romanian-borders app); drawn on a 64 grid, so a thicker stroke to match the others -->
            <svg viewBox="0 0 64 64"><path d="M55.3,51.4L51.4,50.6L50.9,49.3L47.5,49.2L46.6,48.3L45.1,47.9L40.7,49L37.1,52L34.4,52.7L32.6,52.1L28.8,51.4L26.6,51.8L21.2,50.5L18.6,50.9L19.4,48.6L17.2,47.3L16,44.9L17.8,44.2L15.7,42.8L14.1,44.7L13.1,43.9L8.9,41.7L9.9,38.8L6.7,37L5.4,35.5L5.7,33.2L2.5,29.8L5.4,29.4L8.1,28.6L10.1,25.3L10.4,24.6L10.4,24.5L10.4,24.5L11.5,22.1L15.6,15.9L18.5,15.1L20.8,12.8L22.2,13.7L27.4,14.6L29.5,14.3L31.6,16.3L31.7,16.3L33.6,14.6L38.7,13.9L39.9,11.7L41.7,11.3L44,12.1L45.8,16.1L48.8,20.3L50.6,22L52,25.3L52.1,27.4L51.3,31.2L52.2,36.1L52.3,36.2L53.1,37.3L55.9,38L59.3,35.9L61.4,36.7L61.5,37.8L61.4,41.1L57.5,42.8L55.4,46.1Z" stroke-width="5.5" /></svg>
          </span>
          <span class="layer-name">Land</span>
          <button type="button" class="layer-toggle" data-layer="terrain" aria-pressed="true" aria-label="Show land"><span class="knob"></span></button>
        </li>
      </ul>

      <p class="map-source">Data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>.<br />Boundaries: Natural Earth.<br />Terrain: NASA Earth Observatory, Blue Marble; close up, <a href="https://s2maps.eu">Sentinel-2 cloudless</a> by EOX IT Services GmbH.</p>
    </section>

    <div class="map-controls" role="group" aria-label="Zoom">
      <button type="button" class="zoom-in" data-zoom="in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
      <button type="button" class="zoom-out" data-zoom="out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg></button>
    </div>
  </main>

  <script src="data/rivers.js"></script>
  <script src="data/roads.js"></script>
  <script src="main.js"></script>
</body>
</html>
